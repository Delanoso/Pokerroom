services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokerroom
      POSTGRES_PASSWORD: pokerroom_dev
      POSTGRES_DB: pokerroom
    ports:
      # 5433 avoids conflict with a local Windows Postgres on 5432
      - "5433:5432"
    volumes:
      - pokerroom_pgdata:/var/lib/postgresql/data

volumes:
  pokerroom_pgdata:
